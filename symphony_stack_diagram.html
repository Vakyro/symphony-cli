<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Symphony CLI · Diagrama del stack</title>
<style>
:root{
  --bg:#f3f1ea; --panel:#fbfaf6; --ink:#1c1b18; --muted:#6c685f; --line:#d8d2c4; --zone:#ebe7dc;
  --ipc:#1f7a6a; --proc:#b0671a; --store:#3d52a0; --net:#b23a5a; --int:#77736a; --fut:#9a958a;
  --mono: ui-monospace,"Cascadia Code","JetBrains Mono","SF Mono",Consolas,monospace;
  --sans: "Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131412; --panel:#1b1c19; --ink:#e9e7e0; --muted:#9b978c; --line:#34362f; --zone:#191a17;
  --ipc:#5cc4ae; --proc:#e7a257; --store:#8ea0ea; --net:#e7839e; --int:#a9a59a; --fut:#77746b; } }
:root[data-theme="dark"]{ --bg:#131412; --panel:#1b1c19; --ink:#e9e7e0; --muted:#9b978c; --line:#34362f; --zone:#191a17;
  --ipc:#5cc4ae; --proc:#e7a257; --store:#8ea0ea; --net:#e7839e; --int:#a9a59a; --fut:#77746b; }
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);display:grid;grid-template-rows:auto auto 1fr}
header{padding:16px 22px 10px;display:flex;flex-wrap:wrap;gap:8px 26px;align-items:baseline;border-bottom:1px solid var(--line)}
header h1{margin:0;font:600 19px var(--mono)}
header h1 span{color:var(--muted);font-weight:400}
header p{margin:0;color:var(--muted);max-width:80ch}
.bar{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding:10px 22px;border-bottom:1px solid var(--line);font-size:13px}
.bar .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bar .lbl{color:var(--muted);font:12px var(--mono)}
.bar button{font:12px var(--mono);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 9px;cursor:pointer}
.bar button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.leg{display:inline-flex;align-items:center;gap:6px;font:12px var(--mono);color:var(--muted)}
.leg i{width:22px;height:0;border-top:2px solid;display:inline-block}
.stage{overflow:auto;position:relative;min-height:0}
.canvas{position:relative;transform-origin:0 0}
.zone{position:absolute;border:1px solid var(--line);background:var(--zone);border-radius:14px}
.zone b{position:absolute;top:-10px;left:14px;background:var(--bg);padding:0 8px;font:600 12px var(--mono);color:var(--muted);white-space:nowrap}
.zone.daemon{background:transparent;border:2px solid var(--ink)}
.zone.daemon b{color:var(--ink);font-size:13px}
svg.edges{position:absolute;inset:0;overflow:visible;pointer-events:none}
svg.labels{z-index:3}
svg.edges path{fill:none;stroke-width:1.6;opacity:.75;transition:opacity .15s}
svg.edges path.fut{stroke-dasharray:6 5}
svg.edges text{font:11px var(--mono);fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round;transition:opacity .15s}
.node{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;transition:opacity .15s,box-shadow .15s,border-color .15s;overflow:hidden}
.node:hover,.node.sel{border-color:var(--ink);box-shadow:0 2px 0 var(--ink)}
.node h3{margin:0 0 4px;font:600 13px/1.25 var(--mono)}
.node .t{display:flex;flex-wrap:wrap;gap:3px}
.node .t span{font:11px var(--mono);padding:1px 6px;border-radius:4px;background:var(--zone);border:1px solid var(--line);white-space:nowrap}
.node ul{margin:2px 0 0;padding:0;list-style:none;font:12px/1.6 var(--mono)}
.node ul li::before{content:"▸ ";color:var(--muted)}
.node .ph{position:absolute;top:7px;right:8px;font:10px var(--mono);color:var(--muted)}
.node.fut{border-style:dashed}
.node.ext{border-left:4px solid var(--proc)} .node.cloud{border-left:4px solid var(--net)} .node.disk{border-left:4px solid var(--store)}
.node.dev{border-left:4px solid var(--int)}
.dim{opacity:.13!important}
.faded{opacity:.28}
.detail{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 36px));background:var(--panel);border:1px solid var(--ink);border-radius:12px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:none;z-index:5}
.detail.on{display:block}
.detail h2{margin:0 26px 6px 0;font:600 15px var(--mono)}
.detail .x{position:absolute;top:8px;right:10px;border:0;background:none;color:var(--muted);font:18px var(--mono);cursor:pointer}
.detail dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px}
.detail dt{color:var(--muted);font:12px var(--mono)}
.detail dd{margin:0}
.detail .conn{margin-top:10px;font:12px/1.6 var(--mono);color:var(--muted);max-height:180px;overflow:auto}
.detail .conn b{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<header>
  <h1>Symphony CLI <span>/ cómo se conecta el stack</span></h1>
  <p>Cada caja es un componente de la plataforma con su tecnología; cada flecha es una conexión real. Pasa el cursor o toca una caja para ver qué viaja por cada flecha y por qué se eligió esa tecnología.</p>
</header>
<div class="bar">
  <div class="grp"><span class="lbl">Hasta fase</span><span id="phases"></span></div>
  <div class="grp"><button id="lbls" aria-pressed="false">todas las etiquetas</button><button id="fit">ajustar</button></div>
  <div class="grp">
    <span class="leg"><i style="border-color:var(--ipc)"></i>IPC / eventos</span>
    <span class="leg"><i style="border-color:var(--proc)"></i>procesos</span>
    <span class="leg"><i style="border-color:var(--store)"></i>disco</span>
    <span class="leg"><i style="border-color:var(--net)"></i>red</span>
    <span class="leg"><i style="border-color:var(--int)"></i>interno</span>
    <span class="leg"><i style="border-color:var(--fut);border-top-style:dashed"></i>futuro</span>
  </div>
</div>
<div class="stage" id="stage"><div class="canvas" id="canvas"><svg class="edges" id="svg"></svg></div></div>
<div class="detail" id="detail"><button class="x" id="dx" aria-label="Cerrar">×</button><h2 id="dt"></h2><div id="dd"></div><div class="conn" id="dc"></div></div>

const svgL=document.createElementNS(ns,'svg');svgL.setAttribute('class','edges labels');svgL.setAttribute('viewBox',`0 0 ${W} ${H}`);svgL.setAttribute('width',W);svgL.setAttribute('height',H);canvas.appendChild(svgL);
function anchor(a,b){
  const ac={x:a.x+a.w/2,y:a.y+a.h/2}, bc={x:b.x+b.w/2,y:b.y+b.h/2};
  const dx=bc.x-ac.x, dy=bc.y-ac.y;
  const horiz = Math.abs(dx)/(a.w/2+b.w/2+40) > Math.abs(dy)/(a.h/2+b.h/2+40);
  if(horiz){ const s=Math.sign(dx)||1; return {p1:{x:s>0?a.x+a.w:a.x,y:ac.y},p2:{x:s>0?b.x:b.x+b.w,y:bc.y},h:1,s}; }
  const s=Math.sign(dy)||1; return {p1:{x:ac.x,y:s>0?a.y+a.h:a.y},p2:{x:bc.x,y:s>0?b.y:b.y+b.h},h:0,s};
}
const edges=[];
// spread multiple edges on same side
const used={};
E.forEach(([f,t,l,ty,fu],i)=>{
  const a=byId[f],b=byId[t]; const an=anchor(a,b);
  const key1=f+(an.h?(an.s>0?'R':'L'):(an.s>0?'B':'T')), key2=t+(an.h?(an.s>0?'L':'R'):(an.s>0?'T':'B'));
  used[key1]=(used[key1]||0)+1; used[key2]=(used[key2]||0)+1;
  edges.push({f,t,l,ty:fu?'fut':ty,fu,an,k1:key1,k2:key2,i1:used[key1],i2:used[key2]});
});
edges.forEach(e=>{
  const off=(k,i)=>{const n=used[k];return (i-(n+1)/2)*14;};
  const {p1,p2,h,s}=e.an;
  if(h){p1.y+=off(e.k1,e.i1);p2.y+=off(e.k2,e.i2);}else{p1.x+=off(e.k1,e.i1);p2.x+=off(e.k2,e.i2);}
  const d=h?Math.max(40,Math.abs(p2.x-p1.x)/2):Math.max(30,Math.abs(p2.y-p1.y)/2);
  const c1=h?{x:p1.x+s*d,y:p1.y}:{x:p1.x,y:p1.y+s*d}, c2=h?{x:p2.x-s*d,y:p2.y}:{x:p2.x,y:p2.y-s*d};
  const path=document.createElementNS(ns,'path');
  path.setAttribute('d',`M${p1.x},${p1.y} C${c1.x},${c1.y} ${c2.x},${c2.y} ${p2.x},${p2.y}`);
  path.style.stroke=`var(--${e.ty})`; path.setAttribute('marker-end',`url(#a-${e.ty})`);
  if(e.fu) path.classList.add('fut');
  svg.appendChild(path); e.path=path;
  const tx=document.createElementNS(ns,'text');
  const mx=(p1.x+3*c1.x+3*c2.x+p2.x)/8, my=(p1.y+3*c1.y+3*c2.y+p2.y)/8;
  tx.setAttribute('x',mx);tx.setAttribute('y',my-4);tx.setAttribute('text-anchor','middle');tx.textContent=e.l;
  svgL.appendChild(tx); e.text=tx;
});
let sel=null, maxPhase=7, labels=false;
function focus(id){
  const keep=new Set(id?[id]:[]);
  edges.forEach(e=>{const on=!id||e.f===id||e.t===id; if(on&&id){keep.add(e.f);keep.add(e.t);}
    e.path.classList.toggle('dim',!on); e.text.classList.toggle('dim',!on);
    const hid=byId[e.f].ph>maxPhase||byId[e.t].ph>maxPhase;
    e.text.style.display=(!hid && (labels || (id&&on)))?'':'none';
    e.path.style.strokeWidth=id&&on?'2.6':''; e.path.style.opacity=id&&on?'1':'';});
  N.forEach(n=>n.el.classList.toggle('dim',!!id&&!keep.has(n.id)));
}
const det=document.getElementById('detail');
function select(id){
  sel=id; N.forEach(n=>n.el.classList.toggle('sel',n.id===id)); focus(id);
  const n=byId[id];
  document.getElementById('dt').textContent=n.t;
  let h=`<div>${n.desc||''}</div><dl><dt>Tecnología</dt><dd>${(n.list||[]).concat(n.tech).join(' · ')||'—'}</dd><dt>Entra en</dt><dd>Fase ${n.ph}</dd>`;
  if(n.why) h+=`<dt>Por qué</dt><dd>${n.why}</dd>`;
  if(n.alt) h+=`<dt>Descartado</dt><dd>${n.alt}</dd>`;
  if(n.extra) h+=`<dt>Nota</dt><dd>${n.extra}</dd>`;
  document.getElementById('dd').innerHTML=h+'</dl>';
  const out=edges.filter(e=>e.f===id).map(e=>`→ <b>${byId[e.t].t}</b> · ${e.l}`);
  const inn=edges.filter(e=>e.t===id).map(e=>`← <b>${byId[e.f].t}</b> · ${e.l}`);
  document.getElementById('dc').innerHTML=out.concat(inn).join('<br>');
  det.classList.add('on');
}
function clearSel(){ sel=null; N.forEach(n=>n.el.classList.remove('sel')); focus(null); det.classList.remove('on'); }
document.getElementById('dx').onclick=clearSel;
document.getElementById('stage').addEventListener('click',clearSel);
// phases
const PH=[[0,'0 · spike'],[1,'1 · core'],[2,'2'],[3,'3 · contexto'],[5,'5'],[7,'7 · todo']];
const pw=document.getElementById('phases');
PH.forEach(([p,l])=>{const b=document.createElement('button');b.textContent=l;b.dataset.p=p;b.setAttribute('aria-pressed',p===7);
  b.onclick=()=>{maxPhase=p;pw.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.p===p));applyPhase();};pw.appendChild(b);});
function applyPhase(){
  N.forEach(n=>n.el.classList.toggle('faded',n.ph>maxPhase));
  edges.forEach(e=>{const off=byId[e.f].ph>maxPhase||byId[e.t].ph>maxPhase; e.path.style.display=off?'none':''; e.text.style.display=off||!labels?'none':'';}); if(sel) focus(sel);
}

const lb=document.getElementById('lbls');
lb.onclick=()=>{labels=!labels;lb.setAttribute('aria-pressed',labels);applyPhase();};
// fit
const stage=document.getElementById('stage');
function fit(){const s=Math.min(1,(stage.clientWidth-20)/W);canvas.style.transform=`scale(${s})`;canvas.parentElement.style.setProperty('--s',s);
  canvas.style.marginBottom=(H*s-H)+'px'; canvas.style.marginRight=(W*s-W)+'px';}
document.getElementById('fit').onclick=fit; addEventListener('resize',fit); fit(); applyPhase();
</script>
