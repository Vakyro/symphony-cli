# lychee (https://github.com/lycheeverse/lychee) — P13.S5
# Se carga automáticamente: es el default de `--config` en lychee >= 0.15.

# Trata las exclusiones como regex sobre el path
exclude_path = [
  "target",
  "docs/spec",
]

# Excluye URLs / locales que no se deben chequear (regex sobre la URL)
exclude = [
  "localhost",
  "127\\.0\\.0\\.1",
]
