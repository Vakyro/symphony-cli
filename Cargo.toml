[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/core",
    "crates/daemon",
    "crates/cli",
    "crates/testkit",
    "xtask",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

# Se llena al usar cada crate (STACK §58, versiones de ADR-0001). Fuera de §58 → justificar en la bitácora.
[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53", default-features = false }
interprocess = { version = "2.4", features = ["tokio"] }
proptest = "1"
ulid = "3"
toml_edit = { version = "0.25.15", features = ["serde"] }
tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
opt-level = 3
lto = "thin"
# Nunca panic = "abort" (STACK §38): el cleanup y el diagnóstico dependen del unwinding.
