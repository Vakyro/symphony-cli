[package]
name = "symphony-daemon"
description = "Daemon de Symphony"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "symphonyd"
path = "src/main.rs"

[dependencies]
symphony-adapter-antigravity = { path = "../adapters/antigravity" }
symphony-adapter-claude = { path = "../adapters/claude" }
symphony-adapter-codex = { path = "../adapters/codex" }
symphony-adapter-common = { path = "../adapters/common" }
symphony-adapter-copilot = { path = "../adapters/copilot" }
symphony-adapter-kimi = { path = "../adapters/kimi" }
symphony-adapter-opencode = { path = "../adapters/opencode" }
symphony-context = { path = "../context" }
symphony-router = { path = "../router" }
symphony-scheduler = { path = "../scheduler" }
symphony-core = { path = "../core" }
symphony-git = { path = "../git" }
symphony-object-store = { path = "../object-store" }
symphony-process = { path = "../process" }
symphony-protocol = { path = "../protocol" }
symphony-store = { path = "../store" }
rusqlite.workspace = true
notify.workspace = true
ignore.workspace = true
miette.workspace = true
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
toml_edit.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
thiserror.workspace = true
sysinfo.workspace = true

[dev-dependencies]
proptest.workspace = true
symphony-testkit = { path = "../testkit" }
symphony-store = { path = "../store" }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "io-util", "sync"] }
