[package]
name = "symphony-gui-bridge"
description = "Puente de la GUI: cliente IPC del daemon, sin lógica de negocio (P15.S1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Solo IPC: como la TUI, nunca abre la base (CONSTRAINTS A10).
[dependencies]
symphony-protocol = { path = "../protocol" }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "process"] }

[dev-dependencies]
symphony-testkit = { path = "../testkit" }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
