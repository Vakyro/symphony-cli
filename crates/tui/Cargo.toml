[package]
name = "symphony-tui"
description = "TUI de Symphony: habla solo con el daemon por IPC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Sin symphony-store ni rusqlite: la TUI nunca abre la base (PLAN P07.S1, CONSTRAINTS A10).
[dependencies]
symphony-protocol = { path = "../protocol" }
ratatui.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
