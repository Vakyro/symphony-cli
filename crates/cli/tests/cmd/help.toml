bin.name = "symphony"
args = ["--help"]
stdout = """
Symphony: coordina tus CLIs de IA para código desde una sola terminal

Usage: symphony[EXE] [COMMAND]

Commands:
  status  Estado del daemon (lo arranca si no está vivo)
