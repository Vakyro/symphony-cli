[package]
name = "symphony-cli"
description = "Symphony: coordina tus CLIs de IA para código desde una sola terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

# P13.S7: lo único que se distribuye (el resto del workspace tiene `publish = false`).
[package.metadata.dist]
dist = true

[[bin]]
name = "symphony"
path = "src/main.rs"

[dependencies]
symphony-adapter-common = { path = "../adapters/common" }
symphony-core = { path = "../core" }
symphony-protocol = { path = "../protocol" }
symphony-tui = { path = "../tui" }
clap.workspace = true
ignore.workspace = true
miette = { workspace = true, features = ["fancy"] }
regex.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros", "process", "io-util"] }

[dev-dependencies]
symphony-adapter-claude = { path = "../adapters/claude" }
symphony-adapter-codex = { path = "../adapters/codex" }
symphony-store = { path = "../store" }
symphony-testkit = { path = "../testkit" }
rusqlite.workspace = true
sysinfo.workspace = true
tempfile.workspace = true
trycmd.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }
